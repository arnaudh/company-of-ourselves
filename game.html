<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Phaser Reproduction</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #3a2f1f;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
